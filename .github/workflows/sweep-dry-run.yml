# TEMPORARY: remove before merging #119.
#
# Lists the zones the sweeper would delete in the CI organization, without
# deleting anything. The Sweep workflow can only be started by hand once it is
# on main, and the CI credentials only exist as repository secrets, so this
# runs the dry run from the pull request instead.
name: Sweep dry run

on:
  pull_request:
    paths:
      - '.github/workflows/sweep-dry-run.yml'
      - 'internal/provider/sweeper_test.go'

permissions:
  contents: read

jobs:
  sweep-dry-run:
    name: List zones the sweeper would delete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - env:
          KEYCARD_CLIENT_ID: ${{ secrets.KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.KEYCARD_CLIENT_SECRET }}
          KEYCARD_ENDPOINT: ${{ secrets.KEYCARD_ENDPOINT }}
        run: make sweep SWEEP_DRY_RUN=1

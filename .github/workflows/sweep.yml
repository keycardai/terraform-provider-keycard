# Deletes zones that acceptance tests left in the CI organization. A test that
# is killed (go test timeout, cancelled job) or fails during destroy never
# deletes its zone. See sweepZones in internal/provider/sweeper_test.go.
name: Sweep

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep leaked test zones
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - env:
          KEYCARD_CLIENT_ID: ${{ secrets.KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.KEYCARD_CLIENT_SECRET }}
          KEYCARD_ENDPOINT: ${{ secrets.KEYCARD_ENDPOINT }}
        run: make sweep

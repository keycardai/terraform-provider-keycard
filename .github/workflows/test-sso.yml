# SSO acceptance tests, called from test.yml. The calling job holds the
# sso-acceptance-tests concurrency group for the whole matrix, so the legs here
# must not set their own concurrency group.
name: SSO Acceptance Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Terraform ${{ matrix.terraform }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform:
          - '1.7'
          - '1.8'
          - '1.9'
          - '1.10'
          - '1.11'
          - '1.12'
          - '1.13'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-test-env
        with:
          terraform_version: ${{ matrix.terraform }}
      - env:
          TF_ACC: "1"
          TF_ACC_LOG_PATH: ${{ runner.temp }}/terraform-sso-test.log
          TF_ACC_LOG: DEBUG
          KEYCARD_CLIENT_ID: ${{ secrets.KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.KEYCARD_CLIENT_SECRET }}
          KEYCARD_ENDPOINT: ${{ secrets.KEYCARD_ENDPOINT }}
        run: go test -v -cover -timeout 300s -parallel=1 -run 'TestAccSSOConnection' ./internal/provider/
        timeout-minutes: 10
      - name: Upload SSO test logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: terraform-sso-test-logs-${{ matrix.terraform }}
          path: ${{ runner.temp }}/terraform-sso-test.log
          if-no-files-found: warn

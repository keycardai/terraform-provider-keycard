            $ref: '#/components/schemas/ApplicationTrait'
        consent:
          description: Consent mode for the application. 'implicit' means consent is automatically granted, 'required' means explicit user consent is needed.
          type: string
          enum:
            - implicit
            - required
      title: Application Update
    ApplicationCredentialBaseFields:
      description: Common fields shared by all application credential types
      type: object
      properties:
        id:
          description: Unique identifier of the credential
          type: string
        organization_id:
          description: Organization that owns this credential
          type: string
        zone_id:
          description: Zone this credential belongs to
          type: string
        slug:
          description: 'URL-safe identifier, unique within the zone'
          type: string
          maxLength: 63
          minLength: 1
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        application_id:
          description: ID of the application this credential belongs to
          type: string
        application:
          description: 'Deprecated: Nested application object. Use application_id to fetch application separately. When this credential appears nested in another API response, this field will be undefined.'
          $ref: '#/components/schemas/Application'
          deprecated: true
        created_at:
          description: Entity creation timestamp
          type: string
          format: date-time
        updated_at:
          description: Entity update timestamp
          type: string
          format: date-time
      required:
        - id
        - organization_id
        - zone_id
        - slug
        - application_id
        - created_at
        - updated_at
      title: Application Credential Base Fields
    ApplicationCredentialToken:
      description: Token-based application credential
      allOf:
        - $ref: '#/components/schemas/ApplicationCredentialBaseFields'
        - type: object
          properties:
            type:
              type: string
              enum:
                - token
            provider_id:
              description: ID of the provider issuing tokens verified by this credential
              type: string
            provider:
              description: 'Deprecated: Nested provider object. Use provider_id to fetch provider separately. When this credential appears nested in another API response, this field will be undefined.'
              $ref: '#/components/schemas/Provider'
              deprecated: true
            identifier:
              description: 'Identifier for this credential. For token type, this equals the subject value, or ''*'' when subject is not specified.'
              type: string
            subject:
              description: 'Subject identifier for the token. When null or omitted, any token from the provider is accepted without checking application-specific claims.'
              type: string
              nullable: true
          required:
            - type
            - provider_id
            - identifier
      title: Application Credential Token
    ApplicationCredentialPassword:
      description: Password-based application credential
      allOf:
        - $ref: '#/components/schemas/ApplicationCredentialBaseFields'
        - type: object
          properties:
            type:
              type: string
              enum:
                - password
            identifier:
              description: 'Username for password credential, also used as OAuth 2.0 client ID'
              type: string
            password:
              description: 'Password for credential (only returned on creation, store securely), also used as OAuth 2.0 client secret'
              type: string
          required:
            - type
            - identifier
      title: Application Credential Password
    ApplicationCredentialPublicKey:
      description: Public key-based application credential
      allOf:
        - $ref: '#/components/schemas/ApplicationCredentialBaseFields'
        - type: object
          properties:
            type:
              type: string
              enum:
                - public-key
            identifier:
              description: 'Client ID for public key credential, also used as OAuth 2.0 client ID'
              type: string
            jwks_uri:
              description: JWKS URI to retrieve public keys from
              type: string
              format: uri
          required:
            - type
            - identifier
            - jwks_uri
      title: Application Credential Public Key
    ApplicationCredentialUrl:
      description: URL-based application credential
      allOf:
        - $ref: '#/components/schemas/ApplicationCredentialBaseFields'
        - type: object
          properties:
            type:
              type: string
              enum:
                - url
            identifier:
              description: URL of the credential (must be a valid URL)
              type: string
              format: uri
          required:
            - type
            - identifier
      title: Application Credential URL
    ApplicationCredentialPublic:
      description: Public credential (no secret storage)
      allOf:
        - $ref: '#/components/schemas/ApplicationCredentialBaseFields'
        - type: object
          properties:
            type:
              type: string
              enum:
                - public
            identifier:
              description: 'Identifier for public credential, also used as OAuth 2.0 client ID'
              type: string
          required:
            - type
            - identifier
      title: Application Credential Public
    ApplicationCredential:
      description: Credentials for accessing external services from applications
      anyOf:
        - $ref: '#/components/schemas/ApplicationCredentialToken'
        - $ref: '#/components/schemas/ApplicationCredentialPassword'
        - $ref: '#/components/schemas/ApplicationCredentialPublicKey'
        - $ref: '#/components/schemas/ApplicationCredentialUrl'
        - $ref: '#/components/schemas/ApplicationCredentialPublic'
      title: Application Credential
    ApplicationCredentialCreate:
      description: Schema for creating a new application credential
      anyOf:
        - $ref: '#/components/schemas/ApplicationCredentialCreateToken'
        - $ref: '#/components/schemas/ApplicationCredentialCreatePassword'
        - $ref: '#/components/schemas/ApplicationCredentialCreatePublicKey'
        - $ref: '#/components/schemas/ApplicationCredentialCreateUrl'
        - $ref: '#/components/schemas/ApplicationCredentialCreatePublic'
      title: Application Credential Create
    ApplicationCredentialCreateResponse:
      description: Response for creating a new application credential
      anyOf:
        - $ref: '#/components/schemas/ApplicationCredentialToken'
        - $ref: '#/components/schemas/ApplicationCredentialPassword'
        - $ref: '#/components/schemas/ApplicationCredentialPublicKey'
        - $ref: '#/components/schemas/ApplicationCredentialUrl'
        - $ref: '#/components/schemas/ApplicationCredentialPublic'
      title: Application Credential Create Response
    TokenCredentialUpdate:
      description: Schema for updating a token credential
      type: object
      properties:
        type:
          type: string
          enum:
            - token
        subject:
          description: 'Subject identifier for the token. Set to null to unset, which allows any token from the provider to be accepted without checking application-specific claims.'
          type: string
          nullable: true
      title: Token Credential Update
    PasswordCredentialUpdate:
      description: Schema for updating a password credential
      type: object
      properties:
        type:
          type: string
          enum:
            - password
      title: Password Credential Update
    PublicKeyCredentialUpdate:
      description: Schema for updating a public key credential
      type: object
      properties:
        type:
          type: string
          enum:
            - public-key
      title: Public Key Credential Update
    UrlCredentialUpdate:
      description: Schema for updating a URL credential
      type: object
      properties:
        type:
          type: string
          enum:
            - url
        identifier:
          description: URL of the credential (must be a valid URL)
          type: string
          format: uri
      title: URL Credential Update
    PublicCredentialUpdate:
      description: Schema for updating a public credential
      type: object
      properties:
        type:
          type: string
          enum:
            - public
        identifier:
          description: 'Identifier for public credential, also used as OAuth 2.0 client ID'
          type: string
      title: Public Credential Update
    ApplicationCredentialUpdate:
      description: Schema for updating an existing application credential
      anyOf:
        - $ref: '#/components/schemas/TokenCredentialUpdate'
        - $ref: '#/components/schemas/PasswordCredentialUpdate'
        - $ref: '#/components/schemas/PublicKeyCredentialUpdate'
        - $ref: '#/components/schemas/UrlCredentialUpdate'
        - $ref: '#/components/schemas/PublicCredentialUpdate'
      title: Application Credential Update
    Zone:
      description: A zone for organizing resources within an organization
      type: object
      properties:
        id:
          description: Unique identifier of the zone
          type: string
        organization_id:
          description: Organization that owns this zone
          type: string
        slug:
          description: 'URL-safe identifier, unique within the zone'
          type: string
          maxLength: 63
          minLength: 1
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        name:
          description: Human-readable name
          type: string
          maxLength: 255
          minLength: 1
        description:
          description: Human-readable description
          type: string
          maxLength: 2048
          nullable: true
        cname:
          description: Custom domain name (CNAME) for the zone
          type: string
          format: hostname
          maxLength: 255
        user_identity_provider_id:
          description: Provider ID configured for user login
          type: string
        protocols:
          description: Protocol configuration for a zone
          type: object
          properties:
            oauth2:
              $ref: '#/components/schemas/ZoneOAuth2Protocol'
            openid:
              $ref: '#/components/schemas/ZoneOpenIDProtocol'
          required:
            - oauth2
            - openid
        encryption_key:
          $ref: '#/components/schemas/EncryptionKeyAwsKmsConfig'
        created_at:
          description: Entity creation timestamp
          type: string
          format: date-time
        updated_at:
          description: Entity update timestamp
          type: string
          format: date-time
      required:
        - id
        - organization_id
        - slug
        - name
        - protocols
        - created_at
        - updated_at
      title: Zone
    ZoneCreate:
      description: Schema for creating a new zone
      type: object
      properties:
        name:
          description: Human-readable name
          type: string
          maxLength: 255
          minLength: 1
        description:
          description: Human-readable description
          type: string
          maxLength: 2048
          nullable: true
        cname:
          description: Custom domain name (CNAME) for the zone
          type: string
          format: hostname
          maxLength: 255
        protocols:
          $ref: '#/components/schemas/ZoneProtocolCreate'
        encryption_key:
          $ref: '#/components/schemas/EncryptionKeyAwsKmsConfig'
      required:
        - name
      title: Zone Create
    ZoneUpdate:
      description: Schema for updating an existing zone (partial update)
      type: object
      properties:
        name:
          description: Human-readable name
          type: string
          maxLength: 255
          minLength: 1
        description:
          description: Human-readable description
          type: string
          maxLength: 2048
          nullable: true
        cname:
          description: Custom domain name (CNAME) for the zone (set to null to remove)
          type: string
          format: hostname
          maxLength: 255
          nullable: true
        user_identity_provider_id:
          description: Provider ID to configure for user login (set to null to unset)
          type: string
          nullable: true
        protocols:
          $ref: '#/components/schemas/ZoneProtocolUpdate'
        encryption_key:
          $ref: '#/components/schemas/EncryptionKeyAwsKmsConfigUpdate'
      title: Zone Update
    Organization:
      description: A Keycard Organization
      type: object
      properties:
        id:
          description: Unique identifier for the Organization
          type: string
          minLength: 1
          maxLength: 255
        name:
          description: Display name for the Organization
          type: string
        label:
          description: A domain name segment for the Organization
          type: string
        created_at:
          description: The time the Organization was created in UTC
          format: date-time
        updated_at:
          description: The time the Organization was most recently updated in UTC
          format: date-time
    OrganizationIdOrLabel:
      type: string
      description: Organization ID or label identifier
      minLength: 1
      maxLength: 255
    SSOConnection:
      description: SSO connection configuration for an organization
      type: object
      properties:
        id:
          description: Unique identifier for the SSO connection
          type: string
        identifier:
          description: SSO provider identifier (e.g., issuer URL)
          type: string
          minLength: 1
          maxLength: 2048
        client_id:
          description: OAuth 2.0 client ID
          type: string
          nullable: true
        client_secret_set:
          description: Whether a client secret is configured
          type: boolean
        created_at:
          description: Entity creation timestamp
          type: string
          format: date-time
        updated_at:
          description: Entity update timestamp
          type: string
          format: date-time
      required:
        - id
        - identifier
        - client_id
        - client_secret_set
        - created_at
        - updated_at
      title: SSO Connection
    SSOConnectionCreate:
      description: Schema for creating an SSO connection
      type: object
      properties:
        identifier:
          description: SSO provider identifier (e.g., issuer URL)
          type: string
          minLength: 1
          maxLength: 2048
        client_id:
          description: OAuth 2.0 client ID
          type: string
        client_secret:
          description: OAuth 2.0 client secret (optional, will be encrypted if provided)
          type: string
      required:
        - identifier
        - client_id
      title: SSO Connection Create
    SSOConnectionUpdate:
      description: Schema for updating an SSO connection
      type: object
      properties:
        identifier:
          description: SSO provider identifier (e.g., issuer URL)
          type: string
          minLength: 1
          maxLength: 2048
        client_id:
          description: OAuth 2.0 client ID (set to null to remove)
          type: string
        client_secret:
          description: OAuth 2.0 client secret (set to null to remove)
          type: string
      title: SSO Connection Update
    SchemaVersionWithZoneInfo:
      description: A versioned Cedar schema that defines the entity model, actions, and context shape used for policy evaluation. Mirrors the published PDP management API (keycard-api).
      type: object
      properties:
        version:
          description: Schema version string (e.g. 2026-02-24)
          type: string
        status:
          description: 'Schema lifecycle status. active: new policy versions can be created against it; deprecated: superseded but still accepts new policy versions; archived: closed to new policy versions.'
          type: string
          enum:
            - active
            - deprecated
            - archived
        cedar_schema:
          description: Cedar schema in human-readable syntax. Populated when format=cedar.
          type: string
          nullable: true
        cedar_schema_json:
          description: Cedar schema as JSON object. Populated when format=json (default).
          type: object
          nullable: true
        is_default:
          description: Whether this is the zone's default schema
          type: boolean
        deprecated_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - version
        - status
        - is_default
        - created_at
        - updated_at
      title: Policy Schema Version
    Pagination:
      description: Cursor-based pagination metadata returned by PDP list endpoints
      type: object
      properties:
        after_cursor:
          description: Cursor of the last item on the current page. Null when there is no next page.
          type: string
          nullable: true
        before_cursor:
          description: Cursor of the first item on the current page. Null when there is no previous page.
          type: string
          nullable: true
      required:
        - after_cursor
        - before_cursor
      title: Pagination
    PolicySchemasList:
      description: A paginated list of policy schemas
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchemaVersionWithZoneInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - items
        - pagination
      title: Policy Schemas List
    Policy:
      description: A policy container. Cedar content is managed separately through immutable policy versions.
      type: object
      properties:
        id:
          type: string
        zone_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_by:
          type: string
          nullable: true
        latest_version_id:
          type: string
          nullable: true
        latest_version:
          description: Human-readable version number of the latest version (e.g., 1, 2, 3)
          type: integer
          nullable: true
        latest_schema_version:
          description: Schema version the latest version was validated against. Null when the policy has no published versions.
          type: string
          nullable: true
        owner_type:
          description: 'Who manages this policy. platform: managed by the Keycard platform; customer: managed by the tenant.'
          type: string
          enum:
            - platform
            - customer
      required:
        - id
        - zone_id
        - name
        - created_at
        - updated_at
        - created_by
        - owner_type
      title: Policy
    PoliciesList:
      description: A paginated list of policies
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - items
        - pagination
      title: Policies List
    CreatePolicyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
      title: Create Policy Request
    UpdatePolicyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      title: Update Policy Request
    PolicySetWithBinding:
      description: A policy set container with its current binding status. Versions and their bindings are managed separately through policy set versions.
      type: object
      properties:
        id:
          type: string
        zone_id:
          type: string
        name:
          type: string
        target_type:
          description: 'What this policy set targets. zone: applies to all requests in the zone; user: scoped to a specific user.'
          type: string
          enum:
            - zone
            - user
        latest_version_id:
          type: string
          nullable: true
        latest_version:
          description: Human-readable version number of the latest version (e.g., 1, 2, 3). Null when the policy set has no versions.
          type: integer
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_by:
          type: string
          nullable: true
        owner_type:
          description: 'Who manages this policy set. platform: managed by the Keycard platform; customer: managed by the tenant.'
          type: string
          enum:
            - platform
            - customer
        active:
          description: Whether this policy set is currently bound to a scope.
          type: boolean
        mode:
          description: Binding mode of the active binding, if any.
          type: string
          enum:
            - active
            - shadow
          nullable: true
        target_id:
          description: Target entity ID. Equals zone_id for zone-targeted sets; the principal identifier for user-targeted sets. Null when unbound.
          type: string
          nullable: true
        active_version_id:
          description: Identifier of the currently active (bound) version. Null when unbound.
          type: string
          nullable: true
        active_version:
          description: Human-readable version number of the active version (e.g., 1, 2, 3). Null when unbound.
          type: integer
          nullable: true
        shadow_version_id:
          description: Identifier of the shadow (observed) version, if any.
          type: string
          nullable: true
        shadow_version:
          description: Human-readable version number of the shadow version, if any.
          type: integer
          nullable: true
      required:
        - id
        - zone_id
        - name
        - target_type
        - created_at
        - updated_at
        - created_by
        - owner_type
        - active
      title: Policy Set With Binding
    PolicySetsList:
      description: A paginated list of policy sets
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicySetWithBinding'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - items
        - pagination
      title: Policy Sets List
    CreatePolicySetRequest:
      description: 'target_type defaults to zone when omitted.'
      type: object
      properties:
        name:
          type: string
        target_type:
          description: 'What this policy set targets. zone: applies to all requests in the zone; user: scoped to a specific user. Defaults to zone.'
          type: string
          enum:
            - zone
            - user
      required:
        - name
      title: Create Policy Set Request
    UpdatePolicySetRequest:
      type: object
      properties:
        name:
          type: string
      title: Update Policy Set Request
    UpdatePolicySetVersionRequest:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          description: Must be true. Binds this version as the active zone policy set.
      additionalProperties: false
      title: Update Policy Set Version Request
    PolicyVersion:
      description: An immutable Cedar policy version published under a policy.
      type: object
      properties:
        id:
          type: string
        policy_id:
          type: string
        zone_id:
          type: string
        version:
          description: Human-readable version number (e.g., 1, 2, 3)
          type: integer
        schema_version:
          description: Schema version this policy was validated against when created.
          type: string
        cedar_raw:
          description: Cedar policy in human-readable syntax. Null when the response was narrowed to the JSON representation via format=json.
          type: string
          nullable: true
        sha:
          description: Hex-encoded content hash
          type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
        archived_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        owner_type:
          description: 'Who manages this policy version. platform: managed by the Keycard platform; customer: managed by the tenant.'
          type: string
          enum:
            - platform
            - customer
      required:
        - id
        - policy_id
        - zone_id
        - version
        - schema_version
        - sha
        - created_at
        - created_by
        - owner_type
      title: Policy Version
    CreatePolicyVersionRequest:
      type: object
      properties:
        cedar_raw:
          description: Cedar policy in human-readable Cedar syntax.
          type: string
          nullable: true
        schema_version:
          description: Schema version to validate this policy against. Must not be archived.
          type: string
      required:
        - schema_version
      title: Create Policy Version Request
    PolicySetManifestEntry:
      description: A single policy-version reference within a policy set manifest.
      type: object
      properties:
        policy_id:
          type: string
        policy_version_id:
          type: string
        sha:
          description: SHA-256 of the policy version content, populated by the server.
          type: string
      required:
        - policy_id
        - policy_version_id
      title: Policy Set Manifest Entry
    PolicySetManifest:
      description: The ordered set of policy versions composing a policy set version.
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PolicySetManifestEntry'
      required:
        - entries
      title: Policy Set Manifest
    PolicySetVersion:
      description: An immutable manifest snapshot of a policy set.
      type: object
      properties:
        id:
          type: string
        policy_set_id:
          type: string
        version:
          description: Human-readable version number (e.g., 1, 2, 3)
          type: integer
        schema_version:
          description: Schema version pinned to this policy set version. Determines the Cedar schema used for evaluation when activated.
          type: string
        manifest:
          $ref: '#/components/schemas/PolicySetManifest'
        manifest_sha:
          description: Hex-encoded SHA-256 of the canonicalized manifest.
          type: string
        active:
          description: Whether this policy set version is currently bound with mode 'active'. Always populated in responses; clients must treat absence as unknown rather than inferring 'not bound'.
          type: boolean
        archived_at:
          description: Timestamp when the version was archived. Non-null only for archived versions; null or absent means not archived.
          type: string
          format: date-time
          nullable: true
        archived_by:
          description: Identifier of the actor that archived the version. Null or absent means not archived.
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        owner_type:
          description: 'Who manages this policy set version. platform: managed by the Keycard platform; customer: managed by the tenant.'
          type: string
          enum:
            - platform
            - customer
      required:
        - id
        - policy_set_id
        - version
        - schema_version
        - manifest
        - manifest_sha
        - created_at
        - created_by
        - owner_type
      title: Policy Set Version
    CreatePolicySetVersionRequest:
      type: object
      properties:
        manifest:
          $ref: '#/components/schemas/PolicySetManifest'
        schema_version:
          description: Schema version to pin to this policy set version.
          type: string
      required:
        - manifest
        - schema_version
      title: Create Policy Set Version Request
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token Authentication
